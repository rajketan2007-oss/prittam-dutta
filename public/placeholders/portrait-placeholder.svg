<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8C877" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252525" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="450" r="280" fill="#C9A24B" opacity="0.08" filter="blur(60px)"/>

  <!-- Editorial Silhouette Shape -->
  <g opacity="0.35" transform="translate(400, 480)">
    <!-- Head & Shoulders silhouette -->
    <path d="M -160,340 C -150,220 -80,180 -40,160 C -10,145 10,145 40,160 C 80,180 150,220 160,340 Z" fill="#2A2A2A"/>
    <ellipse cx="0" cy="50" rx="90" ry="115" fill="#333333"/>
    <!-- Glasses subtle vector cue -->
    <rect x="-65" y="40" width="50" height="30" rx="8" fill="none" stroke="#C9A24B" stroke-width="2" opacity="0.6"/>
    <rect x="15" y="40" width="50" height="30" rx="8" fill="none" stroke="#C9A24B" stroke-width="2" opacity="0.6"/>
    <line x1="-15" y1="55" x2="15" y2="55" stroke="#C9A24B" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Framing & Crop Markings -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#C9A24B" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="60" x2="60" y2="60" stroke="#C9A24B" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="60" stroke="#C9A24B" stroke-width="2"/>
  <line x1="770" y1="60" x2="740" y2="60" stroke="#C9A24B" stroke-width="2"/>
  <line x1="770" y1="30" x2="770" y2="60" stroke="#C9A24B" stroke-width="2"/>
  <line x1="30" y1="940" x2="60" y2="940" stroke="#C9A24B" stroke-width="2"/>
  <line x1="30" y1="970" x2="30" y2="940" stroke="#C9A24B" stroke-width="2"/>
  <line x1="770" y1="940" x2="740" y2="940" stroke="#C9A24B" stroke-width="2"/>
  <line x1="770" y1="970" x2="770" y2="940" stroke="#C9A24B" stroke-width="2"/>

  <!-- Editorial Info Overlay -->
  <text x="400" y="760" font-family="monospace" font-size="12" fill="#C9A24B" letter-spacing="3" text-anchor="middle" font-weight="600">(PORTRAIT PLACEHOLDER)</text>
  <text x="400" y="795" font-family="sans-serif" font-size="20" fill="#F2EFE9" letter-spacing="1" text-anchor="middle" font-weight="600">PRITAM DUTTA</text>
  <text x="400" y="825" font-family="sans-serif" font-size="13" fill="#A0A0A0" letter-spacing="0.5" text-anchor="middle">Founder &amp; Entrepreneur</text>
  <text x="400" y="870" font-family="monospace" font-size="10" fill="#666666" letter-spacing="1.5" text-anchor="middle">REPLACE IN: /public/placeholders/portrait-placeholder.jpg</text>
</svg>
